# Stations (PLAN.md section 5.5) in the real room (map package 24 Nov 2026). Positions come from the tags in
# tags.yaml; this file says how close to stop. Distances are from the wall the tags are on to the robot's centre.
#   tag_ids          [left, right] as you face the tags
#   standoff_m       final position after alignment
#   approach_m       Nav2 goal; alignment starts from here
#   lateral_offset_m + = stop right of centre (facing the tags)
#   back_in          false: the tray tips out over the front (ultrasonic end)
#   contact_range_m  front ultrasonic reading that counts as arrived (-1 / absent: docking.yaml's)
# Dock pair: facing it, 0 is on the left, 1 on the right (camera check 24 Nov; the map package had them swapped).
# No "unknown" station (24 Nov): unrecognised items go back to the dock (mission unknown_station '').
# 25 Nov: the pickup moved ~1 m right of mechanical; its old spot is now the tools return box (tags 16, 17).
stations:
  dock:       {tag_ids: [0, 1],   standoff_m: 0.35, approach_m: 1.10, is_dock: true}
  pickup:     {tag_ids: [2, 3],   standoff_m: 0.33, approach_m: 0.90, contact_range_m: 0.213}   # 24 Nov: front 20 cm (13 cm sensor offset; it rolls ~1.3 cm on)
  electrical: {tag_ids: [10, 11], standoff_m: 0.38, approach_m: 0.90, contact_range_m: 0.225}   # 24 Nov: robot pressing the box (edge 22 cm from the wall), dump landed
  mechanical: {tag_ids: [12, 13], standoff_m: 0.35, approach_m: 0.90}   # not driven yet
  tools:      {tag_ids: [16, 17], standoff_m: 0.35, approach_m: 0.90}   # 25 Nov: box at the old pickup spot
