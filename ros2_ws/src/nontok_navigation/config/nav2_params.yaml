# Nav2 settings for Nontok (PLAN.md sections 5.6 and 13.8). ROS 2 Humble.
# NOT YET RUN ON A ROBOT: written from the Humble documentation; expect to tune at CP5.
# The launch file fills in: the behaviour-tree path, the map file and the footprint.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: REPLACED_BY_LAUNCH
    default_nav_through_poses_bt_xml: REPLACED_BY_LAUNCH

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odometry/local
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # Loose on purpose: a robot that only drives forward and turns cannot remove a small
      # sideways error once it is at the goal. Tag alignment (which can strafe) does the rest.
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      # DWB, not MPPI: the packaged MPPI controller dies with an illegal instruction on the
      # Jetson Nano's Cortex-A57 (found 16 November 2026), and DWB is much lighter.
      # The rotation shim turns the robot on the spot to face a path that starts behind or
      # beside it; DWB alone sat still at the pickup point when the station was behind it.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.4
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      debug_trajectory_details: false
      # Forward, turn, and a slow sidestep. The sidestep is what lets the robot settle on a
      # goal it has arrived beside. The side ultrasonics cover the direction of a sidestep.
      min_vel_x: 0.0                 # never reverse: nothing senses behind the robot
      max_vel_x: 0.25
      min_vel_y: -0.08
      max_vel_y: 0.08
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 1.5
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -2.0
      vx_samples: 10
      vy_samples: 5
      vtheta_samples: 16
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: REPLACED_BY_LAUNCH
      footprint_padding: 0.03
      transform_tolerance: 0.3
      plugins: [static_layer, range_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      range_layer:
        plugin: nav2_costmap_2d::RangeSensorLayer
        enabled: true
        topics: [/range/left45, /range/right45, /range/front, /range/left, /range/right]
        input_sensor_type: VARIABLE
        phi: 1.2
        inflate_cone: 1.0
        # 0 = off. In this Nav2 release a single gap longer than the timeout (a slow start
        # is enough) marks the layer "not current" for good, and the controller then waits
        # for ever without an error. The base bridge does the job instead: it sends zero
        # velocity and reports RANGES_LOST when the ultrasonics go quiet for 1 s.
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 0.5
      resolution: 0.05
      footprint: REPLACED_BY_LAUNCH
      footprint_padding: 0.03
      transform_tolerance: 0.3
      track_unknown_space: false
      plugins: [static_layer, inflation_layer]     # ultrasonic marks stay in the local costmap
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    yaml_filename: REPLACED_BY_LAUNCH

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.15
      allow_unknown: false
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [wait]          # no spin, no back-up
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.25, 0.08, 0.8]
    min_velocity: [0.0, -0.08, -0.8]
    max_accel: [0.3, 0.3, 1.5]
    max_decel: [-0.5, -0.5, -2.0]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
