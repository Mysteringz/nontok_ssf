# The lab as rectangles, in metres, in the map frame (origin = docked robot centre, x = the way it
# faces, y = its left). APPROXIMATE, from the 24 Nov 2026 room sketch: room 2.50 m wide (left wall
# to right wall); depth NOT measured, far wall assumed 3.00 m from the front wall.
# 25 Nov: the pickup moved ~1 m right of mechanical (y ~2.2), so the room goes on past the old far wall:
# far wall now ASSUMED at y 2.60 (just past the pickup), still not measured.
# Room frame (cm) -> map: x = (35 - along) / 100, y = (out - 120) / 100. Walls drawn 0.10 m thick.
# After editing, regenerate:
#   python3 -m nontok_navigation.draw_map --layout config/lab_layout.yaml --out config/map
resolution: 0.05
bounds: [-2.40, -1.45, 0.60, 2.85]        # area covered by the map: [x_min, y_min, x_max, y_max]

walls:
  - {name: left wall (dock),                 rect: [0.35, -1.30, 0.45, 2.70]}
  - {name: right wall (pickup, mechanical),  rect: [-2.25, -1.30, -2.15, 2.70]}
  - {name: front wall (electrical),          rect: [-2.25, -1.30, 0.45, -1.20]}
  - {name: far wall (ASSUMED, not measured), rect: [-2.25, 2.60, 0.45, 2.70]}

furniture: []      # benches, cabinets, fixed equipment: none reported yet

keep_out: []      # places the robot must not enter even though they look free (25 Nov: the old
                  # unmeasured far end y 1.50-1.80 is now the way to the pickup)
