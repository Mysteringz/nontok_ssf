# Which station each item type goes to (PLAN.md section 7.4).
# Demo items fixed 2026-11-21. The names must match the class folder names used for training
# (training/video: videos/<session>/<item>.mkv). "empty" needs no entry.
items:
  led: electrical
  resistor: electrical
  bolt: mechanical
  multimeter: electrical   # 24 Nov: the electrical depot takes multimeters back
  scissor: mechanical      # 24 Nov trained model (items.onnx): class names must match the model
  screwdrivers: mechanical
# Anything else (or a low-confidence answer) is "unknown": the mission takes it to the
# "unknown" station (mission.yaml unknown_station) for a person to sort by hand.

# ---- For the zero-shot model only (ClipZeroShot); the trained model ignores this. ----
# What each item looks like, in plain words. Several phrases per item are averaged. After
# editing, run training/build_item_prompts.py on a PC and copy items_clip.npz to the robot.
descriptions:
  led: [an LED, a small light-emitting diode with two wire legs, a 5 mm LED with a coloured plastic dome]
  resistor: [a resistor, a small electronic resistor with coloured bands and two wire legs]
  bolt: [a bolt, a metal bolt, a metal screw]
  multimeter: [a multimeter, a handheld digital multimeter with test leads, a red digital multimeter]
  scissor: [a pair of scissors, scissors with green handles, metal scissors]
  screwdrivers: [a screwdriver, a pink and yellow screwdriver, a small screwdriver with a coloured handle]
# Things the camera may see that are not items. A picture that fits one of these best is
# reported as "unknown".
not_items:
  empty: [an empty tray, an empty box, a plain empty surface]
  hand: [a human hand, a person's hand reaching in]
  scene: [a room, a laboratory with workbenches, a ceiling with lights, an office]
  person: [a person, a person's face, a person's arm or clothing]
