# Tag positions in the map frame (PLAN.md section 5.2). APPROXIMATE: from the 24 Nov 2026 room sketch
# (distances marked "about"); replace with tape measurements (target +-1-2 cm), see README of the map package.
#   x, y, z : centre of the tag in metres. Origin = robot centre when docked, x = the way the
#             docked robot faces, y = to its left, z = height above the floor.
#   yaw_deg : direction the tag FACES (its outward normal), in map degrees.
# Room frame used to measure (cm): "along" = along the front (electrical) wall to the right,
# "out" = from the front wall into the room. Docked robot centre = along 35, out 120.
#   x = (35 - along) / 100,  y = (out - 120) / 100
# Pairs are 0.30 m centre to centre, centres 0.20 m high (confirmed 24 Nov).
default_size: 0.160
tags:
  0:  {x: 0.35,  y: 0.15,  z: 0.20, yaw_deg: 180.0}   # dock, LEFT as you face it (camera check 24 Nov; the map package had 0 and 1 swapped). along 0, out 135
  1:  {x: 0.35,  y: -0.15, z: 0.20, yaw_deg: 180.0}   # dock, RIGHT as you face it. along 0, out 105
  2:  {x: -2.15, y: -0.15, z: 0.20, yaw_deg: 0.0}     # pickup, left.                               along 250, out 105
  3:  {x: -2.15, y: 0.15,  z: 0.20, yaw_deg: 0.0}     # pickup, right.                              along 250, out 135
  10: {x: -1.55, y: -1.20, z: 0.20, yaw_deg: 90.0}    # electrical, left.                           along 190, out 0
  11: {x: -1.85, y: -1.20, z: 0.20, yaw_deg: 90.0}    # electrical, right (reference tag).          along 220, out 0
  12: {x: -2.15, y: 1.05,  z: 0.20, yaw_deg: 0.0}     # mechanical, left.                           along 250, out 225
  13: {x: -2.15, y: 1.35,  z: 0.20, yaw_deg: 0.0}     # mechanical, right.                          along 250, out 255
  # 14-17 (unknown, tools) are not in the room any more.
