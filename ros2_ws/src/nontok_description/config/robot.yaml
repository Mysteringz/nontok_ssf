# Robot geometry. PLACEHOLDERS: measure everything on the real robot (PLAN.md section 12).
# Positions are in metres relative to base_link: the centre of the four wheels, on the floor,
# x forward (toward the ultrasonic end), y left, z up. Angles in degrees.
footprint: [[0.17, 0.14], [0.17, -0.14], [-0.17, -0.14], [-0.17, 0.14]]   # corners, clockwise from front-left

imu: {xyz: [0.0, 0.0, 0.08]}

cameras:          # xyz = lens position; yaw = viewing direction; pitch > 0 looks downward; roll > 0 = turned CCW about x
  # front_left / front_right measured 24 Nov from the station tags: side offset and yaw from solvePnP over a 20 cm
  # straight drive (ultrasonic for the scale); height, pitch, roll fitted to the docking solver over 0.43-0.65 m
  # (5.3 / 5.5 px). x (0.12) not measured.
  front_left:  {xyz: [0.12, 0.080, 0.098], yaw_deg: -1.1, pitch_deg: 4.6, roll_deg: 2.9}
  front_right: {xyz: [0.12, -0.080, 0.090], yaw_deg: -3.4, pitch_deg: -0.8, roll_deg: -3.3}
  rear:        {xyz: [-0.12, 0.0, 0.20],  yaw_deg: 180.0, pitch_deg: 0.0}
  tray:        {xyz: [0.0, 0.0, 0.45],    yaw_deg: 0.0,   pitch_deg: 90.0}

ranges:           # xyz = sensor face; yaw = beam direction
  left45:  {xyz: [0.11, 0.07, 0.08],  yaw_deg: 45.0}
  right45: {xyz: [0.11, -0.07, 0.08], yaw_deg: -45.0}
  front:   {xyz: [0.13, 0.0, 0.08],   yaw_deg: 0.0}
  left:    {xyz: [0.0, 0.10, 0.08],   yaw_deg: 90.0}
  right:   {xyz: [0.0, -0.10, 0.08],  yaw_deg: -90.0}
