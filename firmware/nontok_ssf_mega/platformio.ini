; Nontok SSF Mega firmware. See PLAN.md sections 6 and 13.4.
[platformio]
default_envs = mega2560

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = arduino-libraries/Servo@^1.2.1
build_flags = -Wall

; Same firmware with the SSD1306 128x32 status display enabled.
[env:mega2560_oled]
extends = env:mega2560
lib_deps =
    arduino-libraries/Servo@^1.2.1
    olikraus/U8g2
build_flags = -Wall -DOLED_ENABLED=1

; Host tests for the hardware-independent code in lib/nontok_core: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall
