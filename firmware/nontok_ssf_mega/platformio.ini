; Nontok SSF Mega firmware. See PLAN.md sections 6 and 13.4.
[platformio]
default_envs = mega2560

; The default build drives the SSD1306 128x32 status display (the robot has one; 24 Nov: a build without it
; silently ignored every OLED line from the bridge).
[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = olikraus/U8g2
build_flags = -Wall -DOLED_ENABLED=1

; Same firmware without the display, for a board with no screen fitted.
[env:mega2560_no_oled]
extends = env:mega2560
lib_deps =
build_flags = -Wall

; Host tests for the hardware-independent code in lib/nontok_core: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall
